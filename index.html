<!DOCTYPE html>
<html>
<head>
    <title>Diwali Code</title>
    <style>
        body { background: #0d1117; color: #fff; font-family: monospace; text-align: center; padding-top: 20%; }
        h1 { color: #58a6ff; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-family: monospace; }
        .flame { width: 15px; height: 25px; background: orange; border-radius: 50% 50% 20% 20%; margin: auto; animation: flicker 0.1s infinite alternate; }
        .base { width: 40px; height: 15px; background: #b05c1b; border-radius: 0 0 20px 20px; margin: auto; }
        @keyframes flicker { to { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div class="flame"></div>
    <div class="base"></div>
    <h1>System.out.println("Happy Diwali");</h1>
    <p style="color: #7ee787;">if (diwali) { celebrate(); }</p>
    <button onclick="alert('✨ Code Compiled Successfully! Happy Diwali! ✨')">Run Code</button>
</body>
</html>
